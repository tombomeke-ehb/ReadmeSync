name: 🚀 Publish .NET Tool

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  # First job: Run tests before publishing
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🔨 Build solution
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Second job: Publish only if tests pass
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: test  # This job only runs if 'test' job succeeds
    permissions:
      packages: write
      contents: read

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 📦 Restore dependencies
        run: dotnet restore ReadmeSync/ReadmeSync.csproj

      - name: ⚙️ Build & pack NuGet tool
        run: dotnet pack ReadmeSync/ReadmeSync.csproj -c Release -o ./nupkg

      - name: 🚀 Publish to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: 🐙 Publish to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate